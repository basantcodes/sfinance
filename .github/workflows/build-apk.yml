name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle command
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Restore release keystore
        shell: bash
        run: |
          missing=""
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || missing="$missing ANDROID_KEYSTORE_BASE64"
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}" || missing="$missing ANDROID_KEY_ALIAS"
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}" || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing GitHub Actions secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions before building release APKs."
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$GRADLE_CMD" = "./gradlew" ]; then
            ./gradlew testDebugUnitTest
          else
            gradle testDebugUnitTest
          fi
          if [ "$GRADLE_CMD" = "./gradlew" ]; then
            ./gradlew assembleRelease -PversionCode="$((GITHUB_RUN_NUMBER + 1))" -PversionName="1.0.${GITHUB_RUN_NUMBER}"
          else
            gradle assembleRelease -PversionCode="$((GITHUB_RUN_NUMBER + 1))" -PversionName="1.0.${GITHUB_RUN_NUMBER}"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Print release signing identity
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "Package: com.aistudio.applet.eafovh"
          keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" | grep -E 'Owner:|SHA256:'
